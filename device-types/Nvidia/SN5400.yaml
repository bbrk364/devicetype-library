comments: |
  **NVIDIA Spectrum-4 SN5400 (`920-9N42E-00RI-3C0`) Specifications & Supported FRU / Configuration Options:**

  - **Datasheet / Hardware Reference:** [NVIDIA Spectrum-4 SN5000 1U Switch Systems Specifications](https://networking-docs.nvidia.com/sn5000hw/specifications)
  - **Platform Architecture:** 1U Open Ethernet Switch powered by NVIDIA Spectrum-4 ASIC (25.6 Tb/s aggregate switching capacity; 128 MB shared packet buffer; AMD EPYC 3251 8-core control-plane CPU with 32 GB DDR4 RAM & 80 GB NVMe SSD).
  - **Airflow, OPN & NOS Software Options:**
    - `920-9N42E-00RI-3C0` (This Template): Connector-to-Power (`C2P`) / Front-to-Rear airflow (`front-to-rear`), Cumulus Linux Secure Boot (`nvidia-cumulus-linux`)
    - `920-9N42E-00FI-3C0`: Power-to-Connector (`P2C`) / Rear-to-Front airflow (`rear-to-front`), Cumulus Linux Secure Boot
    - Also available with Enterprise SONiC / ONIE open-networking boot image options
  - **Physical Dimensions (H x W x D):** 1.72 x 17.24 x 28.00 in (43.8 x 438.0 x 711.2 mm, 1RU)
  - **Chassis Weight:** 33.07 lb (15.0 kg) fully populated with 2x PSUs and 6x fan modules
  - **Supported Power Supply Options (1+1 Redundant Hot-Swappable):**
    - 2x 1500W AC (100–240 VAC, 50/60 Hz, IEC C14/C15) Platinum/Titanium-rated hot-swappable PSUs (airflow-matched `C2P` or `P2C`)
    - High-Voltage DC (HVDC 240V–380V) / -48V DC redundant power supply options
    - Typical Power Draw: ~450W (with passive DAC cables, ATIS) / ~950W (with 64x active optical modules)
  - **Supported Fan Module Options (6x Hot-Swappable N+1 Redundant Trays):**
    - Counter-rotating high-static-pressure 1U hot-swappable fan modules (`C2P` Front-to-Rear or `P2C` Rear-to-Front airflow matched)
  - **Port & Breakout Configuration Options:**
    - **Ports 1–64 (`swp1`–`swp64`):** 64x QSFP112 cages (10/25/50/100/200/400GbE); supports breakout into 128x 200GbE or 256x 100GbE
    - **Port 65 (`swp65`):** 1x SFP28 auxiliary/management uplink cage (1/10/25GbE)
  - **Supported NVIDIA LinkX Transceiver & Cable Options:**
    - 400G QSFP112 Single-Mode & Multimode Optical Transceivers (`MMA4Z00-NS400`, `MMS4X00` series)
    - 400G QSFP112 Passive DACs, Active Copper Cables (ACC), and 1:2 / 1:4 QSFP112 Breakout Splitter Cables
    - 25GbE SFP28 DAC / Optical Transceivers (`MCP2M00-A004E26L` for port `swp65`)
  - **Management & Console Interfaces:** 2x `mgmt0`/`mgmt1` (1000base-t RJ-45 out-of-band management), 1x `console` (RJ-45 RS-232), and 1x `usb0` (USB-A).
