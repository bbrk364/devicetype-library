comments: |
  **NVIDIA Quantum-X800 (`Q3401-RD`) Specifications & Supported FRU Options:**
  - **Platform Architecture:** 4U Direct-to-Chip (DLC) Liquid-Cooled Managed XDR InfiniBand Switch powered by 4x NVIDIA Quantum-X800 Switch ASICs (115.2 Tb/s aggregate switching capacity; 144x 800Gb/s XDR ports via 72x twin-port OSFP-RHS cages).
  - **Cooling & Model Variants:**
    - `Q3401-RD`: Direct-to-Chip (DLC) Liquid-Cooled switch with Connector-to-System / Rear-to-Front (`-R`) residual airflow (cold-plate loop cools the 4x Quantum-X800 ASICs; rear fans cool optics/PSUs)
    - `Q3400-RA`: Full Air-Cooled Connector-to-System / Rear-to-Front (`-RA`) chassis variant
    - `Q3400-FA`: Full Air-Cooled System-to-Connector / Front-to-Rear (`-FA`) chassis variant
  - **Physical Dimensions (H x W x D):** 6.97 x 17.24 x 29.53 in (177.0 x 438.0 x 750.0 mm, 4RU)
  - **Chassis Weight:** ~112.0 lb (50.8 kg) fully populated with liquid manifold, PSUs, and fan modules
  - **Liquid Cooling Interface Options:**
    - Rear-access blind-mate or quick-disconnect (UQD / Staubli) supply & return coolant couplings for rack CDU manifold integration (supports warm-water ASHRAE W4/W45 facility loops)
  - **Supported Power Supply Options (N+N / N+1 Redundant Hot-Swappable):**
    - High-efficiency 2000W / 3000W AC (200–277V) Titanium-rated hot-swappable PSU modules (`-R` Rear-to-Front airflow matched)
    - High-Voltage DC (HVDC 240V–380V) / -48V DC redundant power supply options
  - **Supported Fan Module Options (Hot-Swappable N+1 Redundant):**
    - Counter-rotating hot-swappable fan trays (`-R` Rear-to-Front airflow matched for OSFP transceiver cage cooling)
  - **Port & Breakout Configuration Options (72x OSFP-RHS Cages):**
    - **Native XDR Mode:** 144x 800Gb/s InfiniBand ports (2x 800Gb/s per twin-port OSFP-RHS cage)
    - **Breakout Mode:** Up to 288x 400Gb/s NDR / XDR-200 ports (using 2:1 or 4:1 passive DAC, ACC, or multimode/single-mode optical splitters)
  - **Supported Transceiver & Cable Options (NVIDIA LinkX 800G XDR):**
    - 800G Twin-Port OSFP-RHS Multimode Optical Transceivers (`MMS4X00-NS400` / `MMS4X50-NM` series, MPO-12 APC)
    - 800G Twin-Port OSFP-RHS Single-Mode DR8/2xFR4 Optical Transceivers
    - 800G OSFP-RHS Direct Attach Copper (DAC) & Active Copper Cables (ACC)
  - **Management & Console Interfaces:** 2x `mgmt0`/`mgmt1` (1000base-t RJ-45 out-of-band management), 1x `console` (RJ-45 RS-232), and 1x `usb0` (USB 3.0 Type-A).
