comments: |
  **NVIDIA Quantum-2 (`MQM9790-NS2F`) Specifications & Supported FRU / Configuration Options:**
  
  - **Platform Architecture:** 1U NDR InfiniBand Switch powered by NVIDIA Quantum-2 ASIC (25.6 Tb/s aggregate switching capacity; 64x 400Gb/s NDR ports via 32x twin-port OSFP cages).
  - **NVIDIA Quantum-2 QM9700 / QM9790 Model & Airflow Options:**
    - `MQM9790-NS2F` (This Template): 1U, Externally Managed, Power-to-Connector (`P2C` / Rear-to-Front, `rear-to-front`) airflow, Standard Depth (560 mm)
    - `MQM9790-NS2R`: 1U, Externally Managed, Connector-to-Power (`C2P` / Front-to-Rear, `front-to-rear`) airflow, Standard Depth (560 mm)
    - `MQM9700-NS2F` / `MQM9700-NS2R`: 1U, Internally Managed (onboard x86 control-plane CPU + dual 1GbE RJ-45 `mgmt0`/`mgmt1` + RS-232 console + USB), `P2C` (`-F`) or `C2P` (`-R`) airflow
  - **Physical Dimensions (H x W x D):** 1.72 x 17.24 x 22.05 in (43.8 x 438.0 x 560.0 mm, 1RU)
  - **Chassis Weight:** 26.20 lb (11.88 kg) fully populated with 2x PSUs and 4x fan modules
  - **Supported Power Supply Options (1+1 Redundant Hot-Swappable):**
    - `MTEF-PSF-AC-G` / `930-9NR00-00FA-000`: 1100W / 1500W AC (100–240 VAC, 50/60 Hz, IEC C14) Platinum-rated hot-swappable PSU (`P2C` / Rear-to-Front airflow — standard for `-NS2F`)
    - `MTEF-PSR-AC-G`: 1100W / 1500W AC hot-swappable PSU (`C2P` / Front-to-Rear airflow — for `-NS2R`)
    - High-Voltage DC (HVDC) / -48V DC redundant power supply options
    - Typical Power Draw: ~305W (with passive DAC cables, ATIS) / ~747W (with 32x active optical transceivers)
  - **Supported Fan Module Options (4x Hot-Swappable N+1 Redundant Trays):**
    - `MTEF-FANF-A` / `930-9NR00-00FF-000`: Counter-rotating hot-swappable fan module (`P2C` / Rear-to-Front airflow — standard for `-NS2F`)
    - `MTEF-FANR-A`: Counter-rotating hot-swappable fan module (`C2P` / Front-to-Rear airflow — for `-NS2R`)
  - **Accessory & Rack-Mount Kit Options:**
    - `MTEF-KIT-D` / `930-9NR00-00FR-000`: Standard 19-inch 4-post toolless rack-mount rail kit
  - **Port & Breakout Configuration Options (32x Twin-Port OSFP Cages):**
    - **Native NDR Mode:** 64x 400Gb/s InfiniBand ports (2x 400Gb/s per twin-port OSFP cage)
    - **Breakout Mode:** Up to 128x 200Gb/s NDR200 / HDR ports (using 2:1 passive DAC, ACC, or multimode/single-mode optical splitters)
  - **Supported NVIDIA LinkX Transceiver & Cable Options (400G NDR):**
    - 800G/2x400G Twin-Port OSFP Multimode Optical Transceivers (`MMS4X00-NS400`, MPO-12 APC) & Single-Mode DR4/FR4 Transceivers (`MMS4X00-NM`)
    - 400G / 800G OSFP Passive DACs (`MCP4Y10-Nxxx`) & Active Copper Cables (`MCA4J80-Nxxx`)
  - **Management & Console Interfaces:** 2x `mgmt0`/`mgmt1` (1000base-t RJ-45 out-of-band management), 1x `console` (RJ-45 RS-232), and 1x `usb0` (USB Type-A).
