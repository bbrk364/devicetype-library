comments: |
  **NVIDIA Quantum-X800 (`Q3200-RA`) Specifications & Family-Wide Configuration Options:**

  - **Platform Architecture:** 2U Managed XDR InfiniBand Switch powered by 2x NVIDIA Quantum-X800 Switch ASICs (57.6 Tb/s aggregate switching capacity; 72x 800Gb/s XDR ports via 36x twin-port OSFP-RHS cages).
  - **NVIDIA Quantum-X800 Series Model Options:** 
    - `Q3200-RA` (This Template): 2U, 72x 800Gb/s XDR ports (36x OSFP-RHS cages), Air-Cooled, Connector-to-System / Rear-to-Front (`rear-to-front`) airflow
    - `Q3400-RA`: 4U, 144x 800Gb/s XDR ports (72x OSFP-RHS cages), Air-Cooled, Connector-to-System / Rear-to-Front (`rear-to-front`) airflow
    - `Q3400-FA`: 4U, 144x 800Gb/s XDR ports (72x OSFP-RHS cages), Air-Cooled, System-to-Connector / Front-to-Rear (`front-to-rear`) airflow
    - `Q3401-RD`: 4U, 144x 800Gb/s XDR ports (72x OSFP-RHS cages), Direct-to-Chip (DLC) Liquid-Cooled with Rear-to-Front (`rear-to-front`) residual airflow
  - **Physical Dimensions (H x W x D):** 3.46 x 17.24 x 29.53 in (88.0 x 438.0 x 750.0 mm, 2RU)
  - **Chassis Weight:** ~56.0 lb (25.4 kg) fully populated with 2x PSUs and 4x fan modules
  - **Supported Power Supply Options (1+1 Redundant Hot-Swappable):**
    - High-efficiency 2000W / 3000W AC (200–277V) Titanium-rated hot-swappable PSU modules (`-RA` Rear-to-Front airflow matched)
    - High-Voltage DC (HVDC 240V–380V) / -48V DC redundant power supply options
  - **Supported Fan Module Options (4x Hot-Swappable N+1 Redundant Trays):**
    - Counter-rotating high-static-pressure hot-swappable fan modules (`-RA` Rear-to-Front airflow matched)
  - **Port & Breakout Configuration Options (36x OSFP-RHS Cages):**
    - **Native XDR Mode:** 72x 800Gb/s InfiniBand ports (2x 800Gb/s per twin-port OSFP-RHS cage)
    - **Breakout Mode:** Up to 144x 400Gb/s NDR / XDR-200 ports (using 2:1 or 4:1 passive DAC, ACC, or optical splitters)
  - **Supported Transceiver & Cable Options (NVIDIA LinkX 800G XDR):**
    - 800G Twin-Port OSFP-RHS Multimode Optical Transceivers (`MMS4X00-NS400` / `MMS4X50-NM` series, MPO-12 APC)
    - 800G Twin-Port OSFP-RHS Single-Mode DR8/2xFR4 Optical Transceivers
    - 800G OSFP-RHS Direct Attach Copper (DAC) & Active Copper Cables (ACC)
  - **Management & Console Interfaces:** 2x `mgmt0`/`mgmt1` (1000base-t RJ-45 out-of-band management), 1x `console` (RJ-45 RS-232), and 1x `usb0` (USB 3.0 Type-A).

