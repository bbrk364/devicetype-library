comments: |
  **NVIDIA DGX B300 (`DGX-B300`) System Specifications & Supported FRU / Configuration Options:**
  
    - **Architecture & Compute Complex:**
    - **GPUs:** 8x NVIDIA Blackwell Ultra B300 SXM GPUs (288 GB HBM3e per GPU; 2,304 GB / 2.3 TB total HBM3e; 64 TB/s aggregate memory bandwidth)
    - **NVLink Fabric:** 5th-Gen NVLink + NVSwitch (1.8 TB/s bidirectional bandwidth per GPU; 14.4 TB/s total bisectional bandwidth)
    - **Host CPUs:** Dual Intel Xeon Platinum 8592+ (64-core) or Xeon 6 series processors
    - **System Memory:** 2 TB – 4 TB DDR5 ECC memory options
  - **Physical Dimensions & Weight (10RU Air-Cooled Chassis):**
    - **Dimensions (H x W x D):** 17.48 x 19.00 x 35.30 in (444.0 x 482.6 x 896.6 mm, 10U)
    - **Chassis Weight:** ~290.0 lb (131.5 kg) fully populated
    - **Airflow:** Front-to-Rear (`front-to-rear`), high-static-pressure hot-swappable fan modules
  - **Supported Power Supply Options (N+N / N+1 Redundant Hot-Swappable):**
    - 6x 3000W / 3300W Titanium-rated AC (200–277V) hot-swappable power supplies (14.5 kW max system power envelope; supports dual-zone 3+3 A/B feed redundancy)
    - Optional High-Voltage DC (HVDC) PSU configuration for data center DC bus bars
  - **Storage Subsystem Options (Front Hot-Swap NVMe Bays):**
    - **OS Boot Drives:** 2x 1.92 TB or 3.84 TB M.2 / E1.S NVMe SSDs (RAID 1)
    - **Internal Cache / Scratch Storage:** 8x 3.84 TB or 7.68 TB U.3 / E1.S PCIe Gen5 NVMe SSDs (30.72 TB or 61.44 TB raw cache)
  - **High-Speed Compute & Storage Fabric Options:**
    - **Compute Fabric (8x Dedicated Rails):** 8x NVIDIA ConnectX-8 SuperNICs (8x OSFP ports, 800Gb/s XDR InfiniBand or 800GbE RoCEv2, 1:1 GPU-to-NIC topology)
    - **Storage & East-West Fabric:** 2x NVIDIA BlueField-3 DPUs (up to 4x QSFP112 ports, dual-port 200GbE / NDR200 or single-port 400GbE / NDR per DPU)
  - **Supported Transceiver & Cable Options (NVIDIA LinkX):**
    - 800G OSFP XDR InfiniBand / 800GbE DAC, ACC, and Multimode/Single-Mode optical transceivers (for ConnectX-8 rails)
    - 400G / 200G QSFP112 NDR / Ethernet optical transceivers & DACs (for BlueField-3 storage ports)
  - **Out-of-Band Management & Console Interfaces:** `bmc` (1000base-t RJ-45 BMC/IPMI/Redfish), `mgmt0` (10gbase-t RJ-45 host management), `console` (RJ-45 RS-232), and `usb0` (USB 3.0 Type-A).

