comments: |
  **NVIDIA Spectrum-4 SN5610 (`920-9N42F-00RI-3C1`) Specifications & Supported FRU / Configuration Options:**
  
  - **Datasheet / Hardware Reference:** [NVIDIA Spectrum-4 SN5000 2U Switch Systems Specifications](https://networking-docs.nvidia.com/sn5000hw/specifications)
  - **Platform Architecture:** 2U Open Ethernet Switch powered by NVIDIA Spectrum-4 ASIC (51.2 Tb/s aggregate switching capacity; 128 MB shared packet buffer; AMD EPYC 3251 8-core control-plane CPU with 32 GB DDR4 RAM & 80 GB NVMe SSD).
  - **Airflow & OPN Options:**
    - `920-9N42F-00RI-3C1`: Connector-to-Power (`C2P`) / Front-to-Rear airflow (`front-to-rear`), Cumulus Linux Secure Boot
    - `920-9N42F-00FI-3C1`: Power-to-Connector (`P2C`) / Rear-to-Front airflow (`rear-to-front`), Cumulus Linux Secure Boot
    - Also available with SONiC / ONIE open-networking boot image options
  - **Physical Dimensions (H x W x D):** 3.46 x 17.24 x 30.51 in (88.0 x 438.0 x 775.0 mm chassis; 31.34 in / 796.0 mm depth including fan levers)
  - **Chassis Weight:** 59.30 lb (26.9 kg) fully populated with 4x PSUs and 5x fan modules
  - **Power Supply Options (4x Hot-Swappable Redundant Bays — N+N / N+1):**
    - 4x 2000W High-Line AC (200–240 VAC, 50/60 Hz, IEC C14/C15) Titanium-rated hot-swappable PSUs (airflow-matched `C2P` or `P2C`)
    - Typical Power Draw: 900W (with passive DAC cables, ATIS) / 2.08 kW (with 64x active optical modules)
  - **Fan Module Options (5x Hot-Swappable 60mm x 60mm N+1 Redundant Trays):**
    - Counter-rotating hot-swappable fan modules (`C2P` Front-to-Rear or `P2C` Rear-to-Front airflow matched)
  - **Port & Breakout Configuration Options:**
    - **Ports 1–64 (`swp1`–`swp64`):** 64x OSFP cages (10/25/50/100/200/400/800GbE); supports breakout into 128x 400GbE, 256x 200GbE, or 256x/512x 100GbE
    - **Ports 65–66 (`swp65`–`swp66`):** 2x SFP28 auxiliary/uplink cages (1/10/25GbE)
  - **Supported NVIDIA LinkX Transceiver & Cable Options:**
    - 800G Twin-Port OSFP Single-Mode & Multimode Optical Transceivers (`MMS4X00-NS`, `MMS4X00-NM`, `MMS4X50-NM`)
    - 800G OSFP Passive DACs, Active Copper Cables (ACC), and 1:2 / 1:4 OSFP Breakout Splitter Cables
    - 25GbE SFP28 DAC / Optical Transceivers (`MCP2M00-A004E26L` for ports `swp65`–`swp66`)
  - **Management & Console Interfaces:** 2x `mgmt0`/`mgmt1` (1000base-t RJ-45 out-of-band management), 1x `console` (RJ-45 RS-232), and 1x `usb0` (USB-A).
