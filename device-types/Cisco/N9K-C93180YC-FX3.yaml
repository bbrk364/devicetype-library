  - **Port Capabilities:**
    - **Downlinks (Ethernet1/1 - 1/48):** Supports 1/10/25-Gbps Ethernet or 16/32-Gbps Fibre Channel (FC)
    - **Uplinks (Ethernet1/49 - 1/54):** Supports 40/100-Gbps QSFP28 Ethernet
  - **Rack Installation:** Full-depth 1RU chassis. Ensure sufficient rear clearance for cable management arms and redundant power feeds.
