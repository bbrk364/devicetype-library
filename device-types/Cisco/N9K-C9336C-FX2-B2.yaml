comments: |
  **Cisco N9K-C9336C-FX2-B2 Commercial Bundle Notes:**
  - **Bundle Contents:** 2x Nexus 9336C-FX2 1-RU Switches + 8x 100G QSFP28 bundled optical transceivers.
  - **Datasheet Reference:** [Cisco Nexus 9336C-FX2 Hardware Installation Guide](https://www.cisco.com/c/en/us/td/docs/switches/datacenter/nexus9000/hw/n9336cfx2_hig/guide/b_n9336cFX2_nxos_hardware_installation_guide/b_n9336cFX2_nxos_hardware_installation_guide_appendix_0111.html)
  - **Physical Dimensions (per chassis):** 1.72 x 17.30 x 24.50 in (4.4 x 43.9 x 62.3 cm with handles)
  - **Chassis Weight (per switch):** 18.74 lb (8.5 kg)
  - **Rack-Mount Kit Included:** `NXK-ACC-KIT-1RU` (4-post slider rail kit)
  - **Supported Power Supply Options (1+1 Redundant):**
    - `NXA-PAC-750W-PI` / `PE`: 750W AC Power Supply (Intake/Burgundy or Exhaust/Blue)
    - `NXA-PAC-1100W-PI3` / `PE3`: 1100W AC Power Supply
    - `NXA-PDC-1100W-PI` / `PE`: 1100W -48V DC Power Supply
  - **Supported Fan Module Options (3 Trays Required):**
    - `NXA-FAN-65CFM-PI` (Intake) or `NXA-FAN-65CFM-PE` (Exhaust)
  - **Management Interfaces:** `mgmt0` (1000base-t RJ-45) and `mgmt1` (1000base-x SFP).
