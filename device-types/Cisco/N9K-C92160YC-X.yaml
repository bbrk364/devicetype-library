comments: |
  **Cisco Nexus 92160YC-X Specifications & Supported Power Supply FRUs:**
  - **Datasheet Reference:** [Cisco Nexus 9200 Platform Switches Datasheet](https://www.cisco.com/c/en/us/products/collateral/switches/nexus-9000-series-switches/datasheet-c78-736166.html)
  - **Physical Dimensions (H x W x D):** 1.72 x 17.30 x 22.50 in (4.4 x 43.9 x 57.1 cm)
  - **Chassis Weight:** 16.5 lb (7.5 kg) base chassis
  - **Supported Power Supply Options (1+1 Redundant):**
    - `NXA-PAC-650W-PE`: 650W AC power supply with port-side exhaust airflow (Blue release latch)
    - `NXA-PAC-650W-PI`: 650W AC power supply with port-side intake airflow (Burgundy release latch)
    - `N9K-PUV-1200W`: 1200W HVAC/HVDC dual-direction power supply (White release latch)
    - `UCS-PSU-6332-DC`: 930W DC power supply with port-side exhaust airflow (Gray release latch)
    - `UCSC-PSU-930WDC`: 930W DC power supply with port-side intake airflow (Green release latch)
    - `NXA-PDC-930W-PE`: 930W DC power supply with port-side exhaust airflow (Blue release latch)
    - `NXA-PDC-930W-PI`: 930W DC power supply with port-side intake airflow (Burgundy release latch)
  - **Supported Fan Module Options (4 Trays Required):**
    - `NXA-FAN-30CFM-PI`: Port-side intake fan module (Burgundy coloring)
    - `NXA-FAN-30CFM-PE`: Port-side exhaust fan module (Blue coloring)
  - **Port Layout:** 48x 10/25G SFP28 fixed downlinks, 4x 40/100G QSFP28 + 2x 40G QSFP+ fixed uplinks.
  - **Management Interfaces:** `mgmt0` (1000base-t RJ-45) and `mgmt1` (1000base-x SFP).
