comments: |
  **Cisco MDS 9132T (`UCS-EP-MDS9132T-E3`) Specifications & Supported FRU Options:**
  
  - **Datasheet Reference:** [Cisco MDS 9132T 32-Gbps 32-Port Fibre Channel Switch Datasheet](https://www.cisco.com/c/en/us/products/collateral/storage-networking/mds-9100-series-multilayer-switches/datasheet-c78-739613.html)
  - **Bundle Configuration:** Cisco UCS / FlexPod Solution Pack (`UCS-EP-MDS9132T-E3`), 16 fixed 32G FC ports (`fc1/1`–`fc1/16`) + 1x Expansion Module Slot (`fc1/17`–`fc1/32`), Port-Side Exhaust airflow (`-E`, front-to-rear), Enterprise Package license included. Base chassis SKU: `DS-C9132T-K9`.
  - **Physical Dimensions (H x W x D):** 1.72 x 17.30 x 22.30 in (4.37 x 43.94 x 56.64 cm)
  - **Chassis Weight:** 18.85 lb (8.55 kg) fully configured with 2x PSUs, 4x fans, and expansion module
  - **Supported Expansion Module (Front Right Slot — Ports `fc1/17`–`fc1/32`):**
    - `DS-X9334-K9`: 16-port 32-Gbps Fibre Channel Expansion Module (hot-swappable)
  - **Supported Power Supply Options (1+1 Redundant):**
    - `DS-CAC-650W-E`: 650W AC power supply with port-side exhaust airflow (Blue release latch — standard for `-E` bundle)
    - `DS-CAC-650W-I`: 650W AC power supply with port-side intake airflow (Burgundy release latch)
    - `DS-CDC-930W-E`: 930W DC power supply with port-side exhaust airflow (Blue release latch)
    - `DS-CDC-930W-I`: 930W DC power supply with port-side intake airflow (Burgundy release latch)
    - `DS-CHV-1200W`: 1200W HVAC/HVDC dual-direction power supply (White release latch)
  - **Supported Fan Module Options (4 Trays Required — Must Match PSU Airflow):**
    - `DS-C48V-FAN-E` / `DS-C32T-FAN-E`: Port-side exhaust fan module (Blue coloring — standard for `-E` bundle)
    - `DS-C48V-FAN-I` / `DS-C32T-FAN-I`: Port-side intake fan module (Burgundy coloring)
  - **Supported Transceiver & Optical Options:**
    - 32G FC SW/LW SFP+ (`DS-SFP-FC32G-SW`, `DS-SFP-FC32G-LW`)
    - 16G FC SW/LW SFP+ (`DS-SFP-FC16G-SW`, `DS-SFP-FC16G-LW`)
    - 8G FC SW/LW SFP+ (`DS-SFP-FC8G-SW`, `DS-SFP-FC8G-LW` — supported in 32G optics backward-compatibility mode)
  - **Port Upgrade & Software License Options:**
    - `M9132T-PL8-K9` / `L-M9132T-PL8-K9`: 8-Port On-Demand Activation License (for `DS-X9334-K9` expansion module)
    - `M9132T-ENT-K9` / `L-M9132T-ENT-K9`: Cisco MDS 9132T Enterprise Package License
  - **Accessory & Rack-Mount Kit Options:**
    - `DS-C32T-RK-KIT`: Standard 4-post rack-mount kit
  - **Management & Console Interfaces:** `mgmt0` (1000base-t RJ-45), `console` (RJ-45 RS-232), and `usb1` (USB 2.0 Type-A).
