    - `NXK-ACC-KIT-1RU`: Standard 1-RU fixed accessory kit with 4-post slider rails, front mounting brackets, and rear brackets
  - **Supported Power Supply Options (1+1 Redundant):**
    - `NXA-PAC-750W-PI` / `PE`: 750W AC Power Supply (Intake/Burgundy or Exhaust/Blue)
    - `NXA-PAC-1100W-PI2/PI3` / `PE2/PE3`: 1100W AC Power Supply (Intake/Burgundy or Exhaust/Blue)
    - `NXA-PHV-1100W-PI` / `PE`: 1100W HVAC/HVDC Power Supply (Intake/Burgundy or Exhaust/Blue)
    - `NXA-PDC-1100W-PI` / `PE`: 1100W -48V DC Power Supply (Intake/Burgundy or Exhaust/Blue)
  - **Supported Fan Module Options (3 Trays Required):**
    - `NXA-FAN-65CFM-PI`: Port-side intake fan module (Burgundy coloring)
    - `NXA-FAN-65CFM-PE`: Port-side exhaust fan module (Blue coloring)
  - **Port Layout:** 36x 40/100G QSFP28 fixed ports supporting flexible breakout and 10G/40G/100G speeds.
  - **Management Interfaces:** `mgmt0` (1000base-t RJ-45) and `mgmt1` (1000base-x SFP).
