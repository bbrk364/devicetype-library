comments: |
  **Cisco MDS 9124V (`DS-C9124V-24PIVK9`) Specifications & Supported FRU Options:**
  - **Datasheet Reference:** [Cisco MDS 9124V 64-Gbps 24-Port Fibre Channel Switch Datasheet](https://www.cisco.com/c/en/us/products/collateral/storage-networking/mds-9100-series-multilayer-switches/mds-9124v-64g-24p-fc-switch-ds.html)
  - **Bundle Configuration:** 24x 64G FC active ports (`fc1/1`–`fc1/24`), Port-Side Intake airflow (`-I`, rear-to-front), standard NX-OS license. Base chassis SKU: `DS-C9124V-K9`.
  - **Physical Dimensions (H x W x D):** 1.72 x 17.30 x 22.30 in (4.37 x 43.94 x 56.64 cm)
  - **Chassis Weight:** 16.53 lb (7.5 kg) fully configured
  - **Supported Power Supply Options (1+1 Redundant):**
    - `DS-CAC-650W-I`: 650W AC power supply with port-side intake airflow (Burgundy release latch — standard for `-I` bundle)
    - `DS-CAC-650W-E`: 650W AC power supply with port-side exhaust airflow (Blue release latch)
    - `DS-CDC-930W-I`: 930W DC power supply with port-side intake airflow (Burgundy release latch)
    - `DS-CDC-930W-E`: 930W DC power supply with port-side exhaust airflow (Blue release latch)
    - `DS-CHV-1200W`: 1200W HVAC/HVDC dual-direction power supply (White release latch)
  - **Supported Fan Module Options (4 Trays Required — Must Match PSU Airflow):**
    - `DS-C48V-FAN-I`: Port-side intake fan module (Burgundy coloring — standard for `-I` bundle)
    - `DS-C48V-FAN-E`: Port-side exhaust fan module (Blue coloring)
  - **Supported Transceiver & Optical Options:**
    - 64G FC SW/LW SFP+ (`DS-SFP-FC64G-SW`, `DS-SFP-FC64G-LW`)
    - 32G FC SW/LW SFP+ (`DS-SFP-FC32G-SW`, `DS-SFP-FC32G-LW`)
    - 16G FC SW/LW SFP+ (`DS-SFP-FC16G-SW`, `DS-SFP-FC16G-LW`)
    - 8G FC SW/LW SFP+ (`DS-SFP-FC8G-SW`, `DS-SFP-FC8G-LW` — supported in 32G optics backward-compatibility mode)
  - **Software License & Upgrade Options:**
    - `M9124V-ENT-K9` / `L-M9124V-ENT-K9`: Cisco MDS 9124V Enterprise Package License (Smart Licensing / PAK)
  - **Accessory & Rack-Mount Kit Options:**
    - `DS-C24V-RK-KIT`: Standard 4-post rack-mount kit
  - **Management & Console Interfaces:** `mgmt0` (1000base-t RJ-45), `console` (RJ-45 RS-232), and `usb1` (USB 2.0 Type-A).
